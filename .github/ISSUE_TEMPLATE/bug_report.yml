name: Bug report
description: Something did not work as described
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Command you ran
      description: For example `hookdistill scan --root examples/sessions`
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Output of `hookdistill version`
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I read any output I pasted here and removed private code, paths and secrets.
          required: true
